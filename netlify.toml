# Deploys come from GitHub, not from a laptop: Netlify watches the `main`
# branch of janzaheer/zedtac-website and publishes every push. There is
# no build step -- the site is plain files -- so Netlify serves the repo root
# exactly as it appears in git. That is the whole point: what is committed is
# what is live, and nothing can go out that is not in the repo.
[build]
  publish = "."
  command = ""

# Netlify serves index.html at a directory root, but this site's single file
# is ZedTac-Website.html, so the root URL had nothing to serve and returned
# 404 -- the page was only reachable at /ZedTac-Website.html.
#
# A 200 rewrite serves that file at every path without changing its name or
# the URL in the address bar. Netlify matches real files first, so /images/*
# and the guide still resolve normally; everything else falls through to the
# app, which is also what the client-side routes need for deep links and
# reloads to work.
[[redirects]]
  from = "/*"
  to = "/ZedTac-Website.html"
  status = 200
